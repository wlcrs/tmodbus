---
name: Publish to PyPI

on: # yamllint disable rule:truthy
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Set global permissions to read-only contents for reusable workflow calls,
# then explicitly grant additional permissions per job.
permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  build:
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read         # Required for actions/checkout
      id-token: write        # Required for file provenance attestations
      attestations: write    # Required for generating attestations
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        with:
          attest-build-provenance-github: "true"

  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write      # Required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: pypi-publish  # Runs only after successful PyPI deployment
    permissions:
      contents: write      # Grants permission to create the release; no 'id-token: write' here!
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
